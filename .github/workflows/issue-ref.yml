# GENERATED by JMC-Go-to-market/.github scripts/build-workflow.mjs (standalone) from
# scripts/issue-ref.mjs. Do not edit by hand; re-run scripts/sync-repo.mjs there.
# Self-contained because this repo cannot call the org's private reusable workflow
# (it is public, or outside the org). Report-only: it warns when a PR body lacks the issue or agent line and
# never fails the PR.
name: issue-ref
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  issue-ref:
    # Only the PR body matters, so skip title/base-only edits, and while report-only
    # also skip new commits (synchronize). A skipped job is not billed; each would
    # otherwise bill a full Actions minute for ~5s of work. Once enforced, synchronize
    # runs again: a skipped run counts as passing, so a push could hide a bad body.
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') &&
      github.event.action != 'synchronize' &&
      (github.event.action != 'edited' || github.event.changes.body != null)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/github-script@v7
        env:
          ENFORCE: "false"
        with:
          script: |
            // Shared PR check for every JMC-Go-to-market repo (called from
            // .github/workflows/issue-ref.yml). A PR must name the issue it works on and
            // the agent (or person) that made it, so the org-wide issue queue stays true
            // without anyone remembering to update it.
            //
            //   Closes #12                                   same-repo issue, closed on merge
            //   Refs JMC-Go-to-market/jmc-architecture#560   cross-repo issue
            //   Agent: claude-code / coordinator-1025 / jay-mac

            const ORG = "JMC-Go-to-market";

            const REF_RE = /\b(close[sd]?|fix(?:e[sd])?|resolve[sd]?|refs?|part of)\s*:?\s+(?:([\w.-]+)\/([\w.-]+))?#(\d+)\b/gi;
            const AGENT_RE = /^\s*agent\s*:\s*\S.*$/im;

            function isBot(user) {
              return !!user && (user.type === "Bot" || /\[bot\]$/.test(user.login ?? ""));
            }

            function parseRefs(body, repo) {
              const refs = [];
              for (const m of (body ?? "").matchAll(REF_RE)) {
                const owner = m[2] ?? ORG;
                const name = m[3] ?? repo;
                refs.push({ owner, repo: name, number: Number(m[4]), keyword: m[1].toLowerCase() });
              }
              return refs;
            }

            function hasAgentLine(body) {
              return AGENT_RE.test(body ?? "");
            }

            // lookup(ref) resolves to { state, isPullRequest } or null when it cannot be read
            // (a private repo the workflow token cannot see). Returns the list of problems.
            async function checkPr({ body, user, repo }, lookup) {
              if (isBot(user)) return [];
              const problems = [];
              const refs = parseRefs(body, repo).filter((r) => r.owner === ORG);
              if (!refs.length) {
                problems.push(`No issue reference. Add "Closes #N" (this repo) or "Refs ${ORG}/<repo>#N" to the PR body.`);
              }
              let open = 0;
              for (const r of refs) {
                const found = await lookup(r);
                if (found === null) { open++; continue; } // cross-repo and unreadable: format is enough
                if (found.isPullRequest) problems.push(`${r.repo}#${r.number} is a pull request, not an issue.`);
                else if (found.state !== "open") problems.push(`${r.repo}#${r.number} is ${found.state}; reference an open issue.`);
                else open++;
              }
              if (refs.length && !open && !problems.length) problems.push("No open issue referenced.");
              if (!hasAgentLine(body)) {
                problems.push('No agent line. Add "Agent: <harness> / <session> / <machine>" (a person writes "Agent: human / <name>").');
              }
              return problems;
            }

            const pr = context.payload.pull_request;
            const lookup = async (r) => {
              try {
                // Outside the org a bare "Closes #N" means this repo, not the org default.
                const owner = r.owner === ORG && r.repo === context.repo.repo ? context.repo.owner : r.owner;
                const { data } = await github.rest.issues.get({ owner: owner, repo: r.repo, issue_number: r.number });
                return { state: data.state, isPullRequest: !!data.pull_request };
              } catch (e) {
                if (r.repo === context.repo.repo) return { state: "missing", isPullRequest: false };
                return null;
              }
            };
            const problems = await checkPr({ body: pr.body, user: pr.user, repo: context.repo.repo }, lookup);
            if (!problems.length) { core.info("issue-ref: ok"); return; }
            const enforce = String(process.env.ENFORCE) === "true";
            for (const p of problems) enforce ? core.error(p) : core.warning(p);
            await core.summary.addHeading("issue-ref").addList(problems).write();
            if (enforce) core.setFailed("issue-ref: " + problems.join(" "));
